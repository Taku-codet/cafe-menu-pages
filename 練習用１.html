<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POSSE CAFE メニュー</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800">
  <header class="bg-white shadow rounded-full px-6 py-4 mx-4 mt-4">
    <h1 class="text-2xl font-bold text-gray-900">POSSE CAFE</h1>
    <p class="text-gray-600 text-sm mt-1">東京・渋谷のスペシャルティコーヒーショップ</p>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8">
    
    <section class="mb-12">
      <h2 class="text-xl font-bold text-gray-800 mb-4">ドリンク</h2>
      <div class="flex flex-col gap-4">
        <div class="bg-white rounded-lg shadow p-6">
          <h3 class="text-lg font-bold text-gray-900">ブレンドコーヒー</h3>
          <p class="text-gray-600 mt-1">本日のおすすめ。深みとコクが特徴です。</p>
          <span class="block text-blue-600 font-bold mt-2">600円</span>
          <button class="bg-gray-200 px-4 py-1 rounded-lg hover:bg-gray-500 hover:text-white mt-2">注文する</button>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
          <h3 class="text-lg font-bold text-gray-900">カフェラテ</h3>
          <p class="text-gray-600 mt-1">なめらかなミルクとエスプレッソのバランス。</p>
          <span class="block text-blue-600 font-bold mt-2">700円</span>
          <button class="bg-gray-200 px-4 py-1 rounded-lg hover:bg-gray-500 hover:text-white mt-2">注文する</button>
        </div>
      </div>
    </section>

    <section>
      <h2 class="text-xl font-bold text-gray-800 mb-4">フード</h2>
      <div class="flex flex-col gap-4">
        <div class="bg-white rounded-lg shadow p-6">
          <h3 class="text-lg font-bold text-gray-900">クロワッサン</h3>
          <p class="text-gray-600 mt-1">サクサクの食感をお楽しみください。</p>
          <span class="block text-blue-600 font-bold mt-2">400円</span>
          <button class="bg-gray-200 px-4 py-1 rounded-lg hover:bg-gray-500 hover:text-white mt-2">注文する</button>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
          <h3 class="text-lg font-bold text-gray-900">パニーニ</h3>
          <p class="text-gray-600 mt-1">ボリューム満点、ランチに最適です。</p>
          <span class="block text-blue-600 font-bold mt-2">800円</span>
          <button class="bg-gray-200 px-4 py-1 rounded-lg hover:bg-gray-500 hover:text-white mt-2">注文する</button>
        </div>
      </div>
    </section>

  </main>

  <footer class="bg-gray-100 text-center py-6 text-gray-500 text-sm">
    <p>2024 POSSE CAFE</p>
  </footer>
</body>
</html>
