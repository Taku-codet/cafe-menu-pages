<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSSE CAFE メニュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-stone-100 text-stone-800">

    <header class="bg-stone-800 shadow-md px-6 py-8 text-center text-stone-100">
      <h1 class="text-3xl font-bold tracking-wider">POSSE CAFE</h1>
      <p class="text-stone-400 text-sm mt-2">東京・渋谷のスペシャルティコーヒーショップ</p>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8">
      
      <section class="mb-10">
        <h2 class="text-xl font-bold text-stone-700 mb-6">DRINK</h2>
        
        <div class="bg-white rounded-lg shadow-sm p-6 mb-4 border border-stone-200">
          <h3 class="text-lg font-semibold">ブレンドコーヒー</h3>
          <p class="text-stone-500 text-sm mt-1">深みとコクが特徴です。</p>
          <div class="flex justify-between items-center mt-4">
            <span class="text-amber-800 font-bold">600円</span>
            <button class="bg-stone-100 hover:bg-stone-200 text-stone-700 px-4 py-1 rounded">注文する</button>
          </div>
        </div>

        <div class="bg-white rounded-lg shadow-sm p-6 mb-4 border border-stone-200">
          <h3 class="text-lg font-semibold">カフェラテ</h3>
          <p class="text-stone-500 text-sm mt-1">なめらかなミルクとエスプレッソの調和。</p>
          <div class="flex justify-between items-center mt-4">
            <span class="text-amber-800 font-bold">700円</span>
            <button class="bg-stone-100 hover:bg-stone-200 text-stone-700 px-4 py-1 rounded">注文する</button>
          </div>
        </div>
      </section>

      <section>
        <h2 class="text-xl font-bold text-stone-700 mb-6">FOOD</h2>
        
        <div class="bg-white rounded-lg shadow-sm p-6 mb-4 border border-stone-200">
          <h3 class="text-lg font-semibold">トースト</h3>
          <p class="text-stone-500 text-sm mt-1">もちもちの厚切りトースト。</p>
          <div class="flex justify-between items-center mt-4">
            <span class="text-amber-800 font-bold">500円</span>
            <button class="bg-stone-100 hover:bg-stone-200 text-stone-700 px-4 py-1 rounded-lg">注文する</button>
          </div>
        </div>
      </section>

    </main>

    <footer class="text-center py-8 text-stone-400 text-xs">
      <p> 2024 POSSE CAFE</p>
    </footer>
  </body>
</html>
